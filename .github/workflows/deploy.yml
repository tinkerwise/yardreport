name: Build and Smoke Test

# Deployment is done locally with `npm run deploy` (scripts/deploy.sh).
# The host's BitNinja firewall blocks GitHub Actions runner IPs on both
# FTP and HTTPS, so CI can neither upload nor health-check the live site.
# CI still verifies every push (and daily) that the site builds cleanly.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

jobs:
  build_and_smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run smoke
